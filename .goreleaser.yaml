# The okdp-compile binaries of a release: goreleaser builds them from the
# release's tag, vX.Y.Z, and attaches them to its GitHub release, which
# release-please has published with its notes
# (.github/workflows/release-please.yml), with an SBOM of each archive
# (syft) and the checksums file signed by cosign, keyless: its Sigstore
# bundle holds the signature and the certificate of the workflow's
# identity. Locally, `goreleaser release --snapshot --clean
# --skip=sign` builds them into dist/ and publishes nothing; `goreleaser
# check` checks this file.
version: 2

project_name: okdp-compiler

builds:
  - id: okdp-compile
    main: ./cmd/okdp-compile
    binary: okdp-compile
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # --version prints the tag without its leading v, as make build does.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # The files' time is the commit's: the same tag builds the same binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: okdp-compile
    ids: [okdp-compile]
    name_template: "okdp-compile_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "okdp-compile_{{ .Version }}_checksums.txt"
  algorithm: sha256

# An SPDX SBOM of each archive, <archive>.sbom.json, by syft (on the PATH:
# anchore/sbom-action/download-syft in the workflow).
sboms:
  - id: archives
    artifacts: archive

# The checksums file signed keyless with cosign (on the PATH:
# sigstore/cosign-installer), the workflow's OIDC token its identity:
# <checksums>.sigstore.json, the Sigstore bundle of the signature, the
# certificate and the transparency log entry. cosign 3 writes the
# signature and the certificate in the bundle only, no longer apart
# (--output-signature, --output-certificate). The checksums cover the
# archives and the SBOMs: verifying the bundle, then the checksums,
# verifies them (README.md, install).
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

# The release notes are release-please's, CHANGELOG.md: goreleaser writes
# none and keeps those of the release it adds the archives to.
changelog:
  disable: true

release:
  mode: keep-existing
