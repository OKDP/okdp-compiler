# A context layer of level 0 after platform.yaml (--context platform.yaml
# --context platform-dcr.yaml): the OAuth clients are registered by each service
# (dcr), the webapp's by an oidc-dcr chart the compiler adds
# (../output-dcr/).
global:
  okdp:
    oidc:
      clientProvisioning: dcr
      dcr:
        registrationUrl: https://sso.okdp.example.org/realms/okdp/clients-registrations/openid-connect
        authMethod: anonymous
        ttlSeconds: 300                # keep the finished Job and its logs 5 minutes
