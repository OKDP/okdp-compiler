# The platform values, the same for every instance: a context layer of
# level 0, merged before the instance's layers.
#
# global.okdp: the platform's settings, which an instance's layers cannot
# change.
global:
  okdp:
    # A setting the compiler does not read, which the mappings do: the
    # domain of the services' hosts.
    cluster:
      domain: okdp.example.org
    # The rule sets the platform requires besides the compiler's mandatory
    # one: a compile without the example's (rules/) is refused.
    ruleSets:
      - {name: example, version: ^1.0.0}
    # The classes of each contract, as Kubernetes' storage classes: each
    # the provider of its claims, an instance, <namespace>/<instance> or,
    # here, <namespace>/<release>, the default one that of the claims that
    # name neither a class nor a provider (database: {}).
    provisioning:
      database:
        default: standard
        classes:
          standard: {provider: demo/demo-db}

# A context layer may set more than global. A connection given here is one
# every instance may reference by name. Here the instance's audit database
connections:
  platform-db:
    contract: database
    description: the platform's shared database
    host: db.okdp.example.org
    dbName: shared
    secretRef: {name: platform-db-credentials}
