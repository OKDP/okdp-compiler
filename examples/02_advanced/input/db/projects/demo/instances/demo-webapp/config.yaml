# The instance's parameters, over the defaults of the package's
# config.schema.json: two replicas, a database of its own, claimed ({}) of
# demo-db, the provider of the platform's default class, the audit database
# platform-db, a connection platform.yaml gives every instance, and values for the app chart as it is (upstream.app), over OKDP's
# defaults and the computed values: a memory limit, and two environment
# variables appended to the computed ones (append: [env]).
replicas: 2
database: {}
audit: platform-db
upstream:
  app:
    resources:
      limits: {memory: 512Mi}
    env:
      - {name: TZ, value: Europe/Paris}
      - {name: LOG_LEVEL, value: debug}
