# The instance's parameters, over the defaults of the package's
# config.schema.json: two replicas, the database of the instance demo-db,
# the audit database platform-db, a connection platform.yaml gives every
# instance, and values for the app chart as it is (upstream.app), over OKDP's
# defaults and the computed values: a memory limit, and two environment
# variables appended to the computed ones (append: [env]).
replicas: 2
database: demo-db
audit: platform-db
upstream:
  app:
    resources:
      limits: {memory: 512Mi}
    env:
      - {name: TZ, value: Europe/Paris}
      - {name: LOG_LEVEL, value: debug}
