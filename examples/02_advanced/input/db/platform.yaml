# The platform values, the same for every instance: a context layer of
# level 0, merged before the instance's layers.
#
# global.okdp: the platform's settings, which an instance's layers cannot
# change.
global:
  okdp:
    ingress:
      suffix: okdp.example.org
      className: nginx
    certificateIssuers:
      selfSigned:
        name: okdp-ca
    oidc:
      issuerUri: https://sso.okdp.example.org/realms/okdp
      # The OAuth clients are registered by each service (dcr), the webapp's
      # by an oidc-dcr chart the compiler adds; existing, the default, has
      # the platform provision them.
      clientProvisioning: dcr
      dcr:
        registrationUrl: https://sso.okdp.example.org/realms/okdp/clients-registrations/openid-connect
        authMethod: anonymous
        ttlSeconds: 300                # keep the finished Job and its logs 5 minutes
    # The classes of each contract, as Kubernetes' storage classes: each
    # the provider of its claims, <namespace>/<release>, the default one
    # that of the claims that name neither a class nor a provider
    # (database: {}).
    provisioning:
      database:
        default: standard
        classes:
          standard: {provider: demo/demo-db}

# A context layer may set more than global. A connection given here is one
# every instance may reference by name. Here the instance's audit database
connections:
  platform-db:
    contract: database
    description: the platform's shared database
    host: db.okdp.example.org
    dbName: shared
    secretRef: {name: platform-db-credentials}
