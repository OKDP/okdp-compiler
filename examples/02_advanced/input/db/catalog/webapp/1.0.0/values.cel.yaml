# The values of the app chart, from the instance's parameters (values), the
# platform values (global.okdp, and platform, derived from them), the
# release and the bindings of okdp.yaml (vars). ${{ ... }} is a CEL
# expression.
app:
  fullnameOverride: ${{ release.name }}-app
  replicaCount: ${{ values.replicas }}
  ingress:
    enabled: true
    className: ${{ global.okdp.ingress.className }}
    annotations: ${{ platform.ingressAnnotations }}
    hosts:
      - host: ${{ host }}
        paths: [{path: /, pathType: Prefix}]
    tls:
      - hosts: ["${{ host }}"]
        secretName: ${{ release.name }}-tls
  env:
    - name: OIDC_ISSUER
      value: ${{ global.okdp.oidc.issuerUri }}
    - name: OIDC_CLIENT_ID
      valueFrom: {secretKeyRef: {name: "${{ platform.oidcClientSecret }}", key: client_id}}
    - name: OIDC_CLIENT_SECRET
      valueFrom: {secretKeyRef: {name: "${{ platform.oidcClientSecret }}", key: client_secret}}
    - $if: ${{ db.size() > 0 }}
      name: DB_URL
      value: jdbc:${{ db.engine }}://${{ db.host }}:${{ str(db.port) }}/${{ db.dbName }}
    - $if: ${{ db.size() > 0 }}
      name: DB_PASSWORD
      valueFrom: {secretKeyRef: {name: "${{ dbSecret }}", key: password}}
    - $if: ${{ audit.size() > 0 }}
      name: AUDIT_DB_URL
      value: jdbc:${{ audit.engine }}://${{ audit.host }}:${{ str(audit.port) }}/${{ audit.dbName }}
    - $if: ${{ audit.size() > 0 }}
      name: AUDIT_DB_PASSWORD
      valueFrom: {secretKeyRef: {name: "${{ auditSecret }}", key: password}}
