# The package of the webapp service: its name, its version, and the upstream
# chart it deploys, under the key app (its name). okdp.yaml says what it is,
# the platform values it needs and how the chart's values are set;
# values.cel.yaml computes them from the instance's parameters (its
# config.yaml over the defaults of config.schema.json).

apiVersion: v2
name: webapp
version: 1.0.0
dependencies:
  - {name: app, repository: https://charts.example.org, version: 1.8.0}
