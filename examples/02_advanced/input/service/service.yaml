# The package of the webapp service: what it is, the platform values it
# needs, and the upstream chart it deploys. values.cel.yaml computes the
# chart's values from the instance's parameters (its config.yaml over the
# defaults of config.schema.json).

name: webapp
version: 1.0.0
roles: [webapp]
dependsOn: [database-server, ingress]
require:                               # platform values the service needs, under global.okdp
  - ingress.suffix
  - ingress.className
  - certificateIssuers.selfSigned.name
  - oidc.issuerUri
charts:
  app:
    source: {repository: https://charts.example.org, chart: app, version: 1.8.0}
    defaults: app.defaults.yaml        # OKDP's defaults, over the chart's own
    upstream: true                     # the instance may set any value, under upstream.app
    # ...except these, set by the platform; and its env is appended to.
    protect: [fullnameOverride, ingress.enabled, ingress.hosts, ingress.tls, 'ingress.annotations["cert-manager.io/*"]']
    append: [env]
