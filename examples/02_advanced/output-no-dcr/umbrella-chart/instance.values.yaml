app:
  env:
    - name: OIDC_ISSUER
      value: https://sso.okdp.example.org/realms/okdp
    - name: OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          key: client_id
          name: creds-demo-webapp-oauth2
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          key: client_secret
          name: creds-demo-webapp-oauth2
    - name: DB_URL
      value: jdbc:postgresql://demo-db-db.demo.svc:5432/demo-db
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: demo-db-database-credentials
    - name: TZ
      value: Europe/Paris
    - name: LOG_LEVEL
      value: debug
  fullnameOverride: demo-webapp-app
  global:
    okdp:
      certificateIssuers:
        selfSigned:
          name: okdp-ca
      charts:
        objects:
          chart: okdp-objects
          repository: oci://registry.example.org/okdp
          version: 1.0.0
      ingress:
        className: nginx
        suffix: okdp.example.org
      oidc:
        issuerUri: https://sso.okdp.example.org/realms/okdp
  image:
    repository: example/webapp
    tag: "1.8"
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: okdp-ca
    className: nginx
    enabled: true
    hosts:
      - host: demo-webapp.okdp.example.org
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - demo-webapp.okdp.example.org
        secretName: demo-webapp-tls
  replicaCount: 2
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
okdp:
  global:
    okdp:
      certificateIssuers:
        selfSigned:
          name: okdp-ca
      charts:
        objects:
          chart: okdp-objects
          repository: oci://registry.example.org/okdp
          version: 1.0.0
      ingress:
        className: nginx
        suffix: okdp.example.org
      oidc:
        issuerUri: https://sso.okdp.example.org/realms/okdp
  objects:
    - apiVersion: v1
      data:
        outputs.yaml: |
          - contract: http
            name: demo-webapp
            values:
              internalUrl: http://demo-webapp-app.demo.svc:8080
              url: https://demo-webapp.okdp.example.org
        service: webapp
        url: https://demo-webapp.okdp.example.org
        usage: |
          A web application. Open https://demo-webapp.okdp.example.org
        version: 1.0.0
      kind: ConfigMap
      metadata:
        labels:
          app.kubernetes.io/instance: demo-webapp
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/name: webapp
          app.kubernetes.io/part-of: okdp
          okdp.io/instance: demo-webapp
          okdp.io/provides-http: "true"
          okdp.io/service: webapp
        name: demo-webapp-okdp
        namespace: demo
