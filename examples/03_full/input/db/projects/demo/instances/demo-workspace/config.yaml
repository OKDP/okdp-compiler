# The instance demo-workspace of the project demo (-f, Inputs.Values), over
# the defaults of the package's config.schema.json, then platform.yaml,
# project.yaml and connections.yaml. A connection reference names a
# connection (the platform's, the project's or the instance's own) or an
# instance of the namespace.
replicas: 2
size: medium
database: demo-db                      # an instance of the namespace: a dependency
audit: platform-db                     # a connection of the platform
storage: datalake                      # likewise
catalogs:                              # references in the items of a list
  - name: sales
    database: demo-warehouse           # connections of the project
    storage: demo-bucket
    properties:
      format: parquet
      compression: zstd
  - name: marketing
    database: demo-db                  # the same instance again: a second dependency
    storage: scratch                   # the instance's own connection (connections.yaml)
  - name: archive                      # no database
    storage: datalake
notifications:
  webhook: demo-alerts                 # an instance providing http
  channels: ["#data-platform", "#demo-alerts"]
admins: [alice@example.org, bob@example.org]
extraEnv:
  WORKSPACE_LOG_FORMAT: json
  WORKSPACE_FEATURE_FLAGS: lineage,preview
features:
  metrics: {interval: 15s}             # enabled by default
  # backup is disabled by default: its chart is left out, and not read

# Values for the upstream charts as they are, over OKDP's defaults and the
# computed values.
upstream:
  api:                                 # api's only: the scheduler accepts none
    env:                               # appended to the computed ones (append: [env])
      - {name: TZ, value: Europe/Paris}
    resources:
      limits: {memory: 3Gi}            # merged over the computed ones
    config:
      workspace.ui.theme: dark         # a key with dots, not protected
    persistence:
      enabled: true
      size: 50Gi
