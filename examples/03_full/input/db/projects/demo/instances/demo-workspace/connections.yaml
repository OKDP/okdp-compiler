# The instance demo-workspace's own connections, a context layer of level
# 2, merged after project.yaml, level 1, and before config.yaml. A level adds: a connection platform.yaml or
# project.yaml gives (platform-db, demo-bucket) may not be given here, not
# even by a field they leave out.

# The instance's own connection, as the platform's and the project's are
# written.
connections:
  scratch:
    contract: s3
    provider: ceph
    endpoint: https://rgw.demo.example.org
    bucket: workspace-scratch
    secretRef: {name: scratch-credentials}
