# OKDP's part of the alerts package: what an instance provides, an HTTP
# endpoint named after its release, which a reference names
# (notifications.webhook: demo-alerts).

require: [ingress.suffix]
provides:
  - contract: http
    values:
      url: https://${{ release.name }}.${{ global.okdp.ingress.suffix }}
      internalUrl: http://${{ release.name }}-api.${{ release.namespace }}.svc:8080
