# OKDP's part of the db package: what an instance provides, a database
# named after its release, which a reference names (database: demo-db),
# and its credentials Secret (<release>-database-credentials), generated.

provides:
  - contract: database
    values:
      host: ${{ release.name }}-db.${{ release.namespace }}.svc
      dbName: ${{ release.name }}
    secret:
      generate: [{key: password}]
