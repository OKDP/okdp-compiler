# The postgresql chart's values: the server, and a database for each
# claim, its owner's password the claim's generated credentials.
postgresql:
  fullnameOverride: ${{ release.name }}-db
  databases: "${{ claims.map(c, {'name': c.id.replace('.', '_').replace('-', '_'), 'owner': c.id, 'existingSecret': c.id + '-credentials'}) }}"
