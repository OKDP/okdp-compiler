# The platform values, the same for every instance of every project of the
# cluster: a context layer of level 0 (Inputs.Context), merged
# first.
# Reviewed with the platform: no project (project.yaml) and no instance
# (connections.yaml, config.yaml) may change a value set here.

global:
  # A key of global outside okdp: every chart receives global, and the
  # mapping sees it as written (global.imageRegistry); a project adds its
  # own beside it (global.project, project.yaml).
  imageRegistry: registry.example.org
  # The platform's settings: level 0 only, a project adds its classes
  # (provisioning) and nothing else of global.okdp.
  okdp:
    ingress:
      suffix: okdp.example.org
      className: nginx
    tls:
      clusterIssuer: okdp-ca           # platform.ingressAnnotations
      caBundleSecret: okdp-ca-bundle   # the CA bundle the OAuth clients' Jobs trust (oidc.dcr.caSecret)
    # The chart the compiler renders its own charts with, the OAuth
    # clients' in dcr mode, here from a mirror of oci://quay.io/adaltas (the
    # default).
    charts:
      oidcDcr: {repository: oci://registry.example.org/mirror, chart: oidc-dcr, version: 0.5.0}
    oidc:
      issuerUri: https://sso.okdp.example.org/realms/okdp/
      # Each service registers its OAuth clients: one oidc-dcr chart per
      # client of its oidcClients section.
      clientProvisioning: dcr
      dcr:
        registrationUrl: https://sso.okdp.example.org/realms/okdp/clients-registrations/openid-connect
        authMethod: anonymous
        ttlSeconds: 300                # keep a finished Job and its logs 5 minutes
        backoffLimit: 3
        waitTtlSeconds: 120            # wait at most 2 minutes for the provider
        image:
          registry: registry.example.org
          repository: mirror/oidc-dcr-job
          tag: 0.5.0
          pullPolicy: Always
    # platform.proxyEnv: HTTP_PROXY, HTTPS_PROXY, NO_PROXY.
    proxy:
      httpProxy: http://proxy.okdp.example.org:3128
      httpsProxy: http://proxy.okdp.example.org:3128
      noProxy: .svc,.cluster.local,.okdp.example.org
    # The platform's secret store, a ClusterSecretStore of External
    # Secrets: the credentials of datalake are there.
    secrets:
      store: okdp-secrets

# Connections every instance of the cluster may reference by name.
connections:
  platform-db:                         # the audit database (audit: platform-db)
    contract: database
    description: the platform's shared PostgreSQL
    host: db.okdp.example.org
    dbName: audit
    secretRef: {name: platform-db-credentials}
  # The shared object store (storage: datalake), which OKDP neither
  # deploys nor manages: its credentials are in the platform's secret store,
  # under the key platform/datalake, accessKey and secretKey its
  # properties. Each instance that references it gets an ExternalSecret
  # that reads them into a Secret of its namespace, and the connection's
  # secretRef names it: demo-workspace.datalake-credentials.
  datalake:
    contract: s3
    endpoint: https://s3.eu-west-1.amazonaws.com
    region: eu-west-1
    bucket: okdp-datalake
    secretRef: {remoteKey: platform/datalake}
