# The package of the workspace service: an API server, its scheduler (a
# second render of the same chart), a gateway in front of them, a metrics
# exporter and an optional backup job. values.cel.yaml computes the charts'
# values from the instance's parameters (its config.yaml over the defaults of
# config.schema.json) and the platform's and project's values.
#
# service.yaml is read as YAML 1.2, strictly: an unknown field fails.

name: workspace
version: 3.2.0-1.4.0                   # <upstream>-<okdp semver>
roles: [notebooks, sql]                # catalog metadata, not read by the compiler
dependsOn: [database-server, object-store, ingress]
require:                               # global.okdp.<path>, each set and not empty
  - ingress.suffix
  - ingress.className
  - certificateIssuers.selfSigned.name
  - key: oidc.issuerUri                # only when OIDC is enabled: a condition on the context
    $if: ${{ platform.oidc.enabled }}
charts:
  api:
    source: &workspace {repository: https://charts.example.org, chart: workspace, version: 3.2.0}
    defaults: api.defaults.yaml        # OKDP's defaults, over the chart's values.yaml
    upstream: true                     # the instance's upstream.api
    # What the instance's upstream values may not set. A key with dots in
    # brackets; a final * names every key starting with the text before it.
    protect:
      - fullnameOverride
      - mode
      - catalogs
      - ingress.enabled
      - ingress.hosts
      - ingress.tls
      - 'ingress.annotations["cert-manager.io/*"]'
      - 'ingress.annotations["nginx.ingress.kubernetes.io/whitelist-source-range"]'
      - 'config["workspace.auth.*"]'
    append: [env, tolerations]         # the instance's lists added after the computed ones
  scheduler:                           # a second render of the workspace chart
    source: *workspace
    defaults: scheduler.defaults.yaml  # no instance values: upstream.api is api's only
  gateway:                             # no OKDP defaults, no instance values
    source: {repository: oci://registry.example.org/charts, chart: gateway, version: 1.4.2}
  metrics:
    source: {repository: oci://registry.example.org/charts, chart: metrics-exporter, version: 0.7.0}
  backup:                              # left out by the mapping unless enabled: never read then
    source: {repository: oci://registry.example.org/charts, chart: backup, version: 2.0.1}
