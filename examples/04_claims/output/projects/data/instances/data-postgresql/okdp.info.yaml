provides:
  - name: demo.analytics
    contract: database-server
    values:
      dbName: demo_analytics
      engine: postgresql
      extensions:
        - postgis
      host: data-postgresql-rw.data.svc
      port: 5432
      size: 50Gi
    secretRef:
      name: demo.analytics-credentials
  - name: demo.app.database
    contract: database-server
    values:
      dbName: demo_app_database
      engine: postgresql
      extensions:
        - pgvector
      host: data-postgresql-rw.data.svc
      port: 5432
      size: 1Gi
    secretRef:
      name: demo.app.database-credentials
  - name: demo.metrics.database
    contract: database-server
    values:
      dbName: demo_metrics_database
      engine: postgresql
      extensions:
        - pgvector
        - timescaledb
      host: data-postgresql-rw.data.svc
      port: 5432
      size: 10Gi
    secretRef:
      name: demo.metrics.database-credentials
