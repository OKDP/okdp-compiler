# The platform values (global.okdp), the same for every instance: a
# platform layer (--platform), which an instance's layers cannot change.
global:
  okdp:
    ingress:
      suffix: okdp.example.org
      className: nginx
    certificateIssuers:
      selfSigned:
        name: okdp-ca
    # The chart OKDP's own objects are rendered with.
    charts:
      objects: {repository: oci://registry.example.org/okdp, chart: okdp-objects, version: 1.0.0}
    oidc:
      issuerUri: https://sso.okdp.example.org/realms/okdp
