# Mapping of the webapp example: the values computed for its upstream charts
# (app, and metrics when enabled), its OAuth client, OKDP's own objects, and
# what the instance publishes. Inputs:
#   release    {name, namespace}
#   values     the parameters; every connection reference (x-okdp-connection-ref)
#              is already resolved to its contract fields
#   global     {okdp: ...}: platform/platform-values.yaml, as written
#   platform   what the compiler derives from global.okdp: oidc (defaults applied,
#              dcr.enabled and the settings of the oidc-dcr Jobs), oidcClientSecret,
#              ingressAnnotations, proxyEnv
#   service    {name, version, appVersion} of the package (service.yaml)
#   labels, selectorLabels   the labels of OKDP's own objects
# ${{ ... }} is a CEL expression: alone in a scalar it keeps its type,
# otherwise it is interpolated as text. Besides CEL's own, the functions
# sha256, toJson, toPrettyJson, toYaml, quote (as Helm's), okdpFullname,
# okdpLabels, okdpSelectorLabels, okdpGeneratedSecret and oidcClientSecret.
let:
  host: ${{ release.name }}.${{ global.okdp.ingress.suffix }}
  # The database parameter: a resolved connection, or "" when not set.
  db: '${{ type(values.database) == map ? values.database : {} }}'
  dbSecret: ${{ db.?secretRef.name.orValue('') }}
  # The application's settings, a ConfigMap of OKDP's (objects) the pods
  # read as environment variables.
  settingsName: ${{ okdpFullname('settings') }}
  settings:
    APP_URL: https://${{ host }}
    METRICS_ENABLED: ${{ str(values.metrics.enabled) }}
  # The session key, generated once in the cluster (External Secrets).
  sessionSecret: ${{ okdpFullname('session') }}

# Each expression returns a list of messages; any message fails the compile.
errors:
  - '${{ values.replicas > 1 && db.size() == 0 ? ["webapp: replicas > 1 needs a database, sessions are stored there"] : [] }}'
  - >-
    ${{ db.size() > 0 && dbSecret == '' ? ['webapp: database connection "' + db.okdp.ref
        + '" has no secretRef, the password cannot be read'] : [] }}

output:
  app:
    fullnameOverride: ${{ release.name }}-app
    replicaCount: ${{ values.replicas }}
    # The application version, from service.yaml: never written in a mapping.
    image:
      tag: ${{ service.appVersion }}
    # A settings change restarts the pods.
    podAnnotations:
      checksum/settings: ${{ sha256(toJson(settings)) }}
    envFrom:
      - configMapRef: {name: "${{ settingsName }}"}
    ingress:
      enabled: true
      className: ${{ global.okdp.ingress.className }}
      annotations: ${{ platform.ingressAnnotations }}
      hosts:
        - host: ${{ host }}
          paths: [{path: /, pathType: Prefix}]
      tls:
        - hosts: ["${{ host }}"]
          secretName: ${{ release.name }}-tls
    env:
      - name: SESSION_KEY
        valueFrom: {secretKeyRef: {name: "${{ sessionSecret }}", key: session-key}}
      # Sign-in: the OAuth client of oidcClients (below), read from its Secret,
      # platform.oidcClientSecret: provisioned by the platform
      # (creds-<release>-oauth2), or written by its oidc-dcr Job in dcr mode
      # (<release>-<namespace>-dcr).
      - name: OIDC_ISSUER
        value: ${{ global.okdp.oidc.issuerUri }}
      - name: OIDC_CLIENT_ID
        valueFrom: {secretKeyRef: {name: "${{ platform.oidcClientSecret }}", key: client_id}}
      - name: OIDC_CLIENT_SECRET
        valueFrom: {secretKeyRef: {name: "${{ platform.oidcClientSecret }}", key: client_secret}}
      - $if: ${{ db.size() > 0 }}
        name: DB_URL
        value: jdbc:${{ db.engine }}://${{ db.host }}:${{ str(db.port) }}/${{ db.dbName }}
      - $if: ${{ db.size() > 0 }}
        name: DB_DRIVER
        value: ${{ db.driver }}
      - $if: ${{ db.size() > 0 }}
        name: DB_PASSWORD
        valueFrom: {secretKeyRef: {name: "${{ dbSecret }}", key: password}}
  # Left out when metrics are off: the chart is not rendered.
  metrics:
    $if: ${{ values.metrics.enabled }}
    target: http://${{ release.name }}-app.${{ release.namespace }}.svc:8080/metrics
    interval: ${{ values.metrics.interval }}

# The OAuth clients of the service, here one: the application's, for the
# sign-in. In dcr mode (global.okdp.oidc.clientProvisioning: dcr), the
# compiler adds a chart oidc-dcr (rendered by the oidc-dcr chart, not listed
# in service.yaml) whose Job registers the client and writes its Secret; the
# platform's settings (global.okdp.oidc.dcr) apply. In existing mode the
# platform provides it: nothing is compiled. Another client would be named
# (name: console: chart console-oidc-dcr, Secret oidcClientSecret('console')).
oidcClients:
  - redirectUris: ['https://${{ host }}/oauth2/callback']
    grantTypes: [authorization_code, refresh_token]

# OKDP's own objects, whole manifests, rendered by the okdp chart after the
# descriptor ConfigMap (service.yaml declares it).
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${{ settingsName }}
      namespace: ${{ release.namespace }}
      labels: ${{ okdpLabels('settings') }}
    data: ${{ settings }}
  # An External Secrets Password generator and the ExternalSecret writing
  # the Secret, as okdp.generatedSecret renders them.
  - $spread: >-
      ${{ okdpGeneratedSecret({'name': sessionSecret, 'keys': [{'key': 'session-key', 'length': 48}]}) }}

instance:
  url: https://${{ host }}
  usage: |
    A web application. Open https://${{ host }}

# The connections this instance publishes: other instances of the project
# reference it by its release name. The compiler checks the values against
# the contract, and against its x-okdp-internal naming convention.
provides:
  - contract: http
    values:
      url: https://${{ host }}
      internalUrl: http://${{ release.name }}-app.${{ release.namespace }}.svc:8080
