# Platform values (platform/platform-values.yaml): the first values layer.
global:
  okdp:
    ingress:
      suffix: okdp.example.org
      className: nginx
    certificateIssuers:
      selfSigned:
        name: okdp-ca
    # Single sign-on. The services' OAuth clients are provisioned by the
    # platform (clientProvisioning: existing, the default; values/dcr.yaml
    # registers them by DCR).
    oidc:
      issuerUri: https://sso.okdp.example.org/realms/okdp
