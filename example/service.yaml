# Service definition of the webapp example (the wrapper chart is webapp/).
# Engine-neutral part: the upstream charts, their base values (OKDP's
# defaults, plain YAML), and what an instance may override: its
# upstream.<chart>.yaml file (upstream: true; or a path, or a list of paths),
# then its inline upstream.<chart> values. The mapping (mapping.cel.yaml)
# computes the rest; it sees the instance's upstream values merged, files
# and inline, as values.upstream.<chart>.

# Platform values the service needs, under global.okdp (the compile fails
# when one is missing).
require:
  - ingress.suffix                     # domain of the instance's host: <release>.<suffix>
  - ingress.className                  # ingress class of the platform
  - certificateIssuers.selfSigned.name # issuer of the instance's TLS certificate
  - oidc.issuerUri                     # identity provider the application signs users in with
# The upstream charts vendored by the wrapper chart (webapp/vendor/<chart>/),
# by name, as the mapping outputs them. A chart may name the vendored chart
# it compiles from and renders with (chart: <vendored chart>), e.g. a chart
# rendered twice. The oidc-dcr chart of the mapping's OAuth client
# (oidcClients) is not listed: the compiler adds it in dcr mode, from
# webapp/vendor/oidc-dcr.
charts:
  app:                                 # the application chart
    base: vendor-values/app.yaml       # OKDP's default values, over the chart's own defaults
    upstream: true                     # user values accepted: upstream.app.yaml, then inline upstream.app
    # Set by the platform: user values may not change them. A key that
    # contains dots is written in brackets, a family of keys with a final
    # glob: here the certificate issuer annotation of the ingress.
    protect: [fullnameOverride, ingress.enabled, ingress.hosts, ingress.tls, 'ingress.annotations["cert-manager.io/*"]']
    append: [env]                      # user lists appended to the computed ones instead of replacing them
  metrics: {}                          # the metrics chart: no base values, no user values
  # OKDP's own objects (the okdp-objects chart, values `objects: []`): the
  # compiler adds the descriptor ConfigMap and the objects section of the
  # mapping (the settings ConfigMap, the session key Secret).
  okdp: {}
