# The platform registers the services' OAuth clients by dynamic client
# registration (platform values, set here for the example): the compile adds
# the oidc-dcr chart of the webapp's client, with the platform's settings of
# the Jobs (defaults: caSecret certs-bundle, ttlSeconds 30, backoffLimit 6,
# the chart's 600 s wait for the provider).
global:
  okdp:
    oidc:
      clientProvisioning: dcr
      dcr:
        registrationUrl: https://sso.okdp.example.org/realms/okdp/clients-registrations/openid-connect
        authMethod: anonymous
        ttlSeconds: 300                # keep the finished Job and its logs 5 minutes
