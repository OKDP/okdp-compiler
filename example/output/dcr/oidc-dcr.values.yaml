backoffLimit: 6
commonLabels:
  app.kubernetes.io/instance: demo-webapp
enabled: true
fullnameOverride: demo-webapp-oidc-dcr
global:
  okdp:
    certificateIssuers:
      selfSigned:
        name: okdp-ca
    charts:
      objects:
        chart: okdp-objects
        repository: oci://registry.example.org/okdp
        version: 1.0.0
    ingress:
      className: nginx
      suffix: okdp.example.org
    oidc:
      clientProvisioning: dcr
      dcr:
        authMethod: anonymous
        registrationUrl: https://sso.okdp.example.org/realms/okdp/clients-registrations/openid-connect
        ttlSeconds: 300
      issuerUri: https://sso.okdp.example.org/realms/okdp
image:
  pullPolicy: IfNotPresent
  pullSecrets: []
  registry: quay.io
  repository: adaltas/oidc-dcr-job
  tag: ""
mapping:
  defaultKeys:
    CLIENT_ID: .client_id
    CLIENT_SECRET: .client_secret
    CLIENTID: .client_id
    CLIENTSECRET: .client_secret
    Client_ID: .client_id
    Client_Secret: .client_secret
    ClientID: .client_id
    ClientId: .client_id
    ClientSecret: .client_secret
    OIDC_CLIENT_ID: .client_id
    OIDC_CLIENT_SECRET: .client_secret
    client-id: .client_id
    client-secret: .client_secret
    client_id: .client_id
    client_secret: .client_secret
    clientId: .client_id
    clientSecret: .client_secret
    clientid: .client_id
    clientsecret: .client_secret
    oidc-client-id: .client_id
    oidc-client-secret: .client_secret
    oidc_client_id: .client_id
    oidc_client_secret: .client_secret
    oidcClientId: .client_id
    oidcClientSecret: .client_secret
  keyMapping:
    client_id: .client_id
    client_secret: .client_secret
    registration_access_token: .registration_access_token
    registration_client_uri: .registration_client_uri
  useDefault: false
registrationUrl: https://sso.okdp.example.org/realms/okdp/clients-registrations/openid-connect
request:
  application_type: web
  client_name: demo-webapp-demo
  grant_types:
    - authorization_code
    - refresh_token
  redirect_uris:
    - https://demo-webapp.okdp.example.org/oauth2/callback
  scope: profile email groups
secret: demo-webapp-demo-dcr
security:
  role: demo-webapp-oidc-dcr
  serviceAccount: demo-webapp-oidc-dcr
tls:
  certificate: certs-bundle
  insecure: false
ttlSeconds: 300
waitForProvider:
  discoveryUrl: https://sso.okdp.example.org/realms/okdp/.well-known/openid-configuration
  ttlSeconds: 600
