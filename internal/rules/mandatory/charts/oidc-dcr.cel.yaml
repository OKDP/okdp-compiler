# The objects that register one OAuth client of a mapping's oidcClients
# section, in dcr mode (global.okdp.oidc.clientProvisioning: dcr), by dynamic
# client registration: a Job on the hardened pod of okdpJob, a
# pre-install/pre-upgrade hook, and a Job that removes the client at uninstall
# (Helm's pre-delete, Argo CD's PostDelete). Each has its ServiceAccount, Role,
# RoleBinding and ConfigMap, hooks too: they exist before their Job, and the
# removal's are created only at uninstall.
#
# The hook weights and sync waves are the ones packages order themselves
# against: objects -10, Jobs -5, before a package's Sync hooks and objects, so
# the client's Secret exists when they start.
#
# Evaluated by okdp-compiler once per client (ownObjects, objects.go) with the
# mapping engine: ${{ CEL }} expressions, the same directives and functions.
#
# Inputs, besides the mapping's context (release, platform, global, values,
# service, labels, selectorLabels):
#   client  the client as the mapping wrote it, checked by the compiler:
#           grantTypes, and the optional redirectUris, scope, clientName,
#           public, request, secret, caSecret; name is
#           "" for the service's main client
#   names   what the compiler names: fullname (the objects, room left for
#           the suffixes: <release>-oidc-dcr or <release>-<name>-oidc-dcr, cut
#           to 56 characters), secret (the Secret the Job writes: client.secret,
#           or oidcClientSecret(name))
# The platform's settings come from platform.oidc.dcr, defaults applied
# (registrationUrl, ttlSeconds, backoffLimit, caSecret, waitTtlSeconds, image).
vars:
  dcr: ${{ platform.oidc.dcr }}
  # A public client (a browser application) has no secret.
  public: ${{ client.?public.orValue(false) }}
  # The requested scope: the client's, or the platform's. openid is left out:
  # it is not a Keycloak client scope, Keycloak refuses it.
  scope: >-
    ${{ first([client.?scope.orValue(''), platform.oidc.scope]).split(' ').filter(s, s != 'openid').join(' ') }}
  issuer: ${{ str(platform.oidc.?issuerUri.orValue('')) }}
  # The registration request: the snake_case fields of the OIDC Dynamic
  # Client Registration standard. The client's request overrides any field
  # but the URLs the provider trusts (oidc-clients.cel.yaml refuses those).
  request:
    $merge: ${{ client.?request.orValue({}) }}
    application_type: web
    # <release>-<namespace>, and -<name> for a named client.
    client_name: >-
      ${{ first([client.?clientName.orValue(''),
                 release.name + '-' + release.namespace + (client.name == '' ? '' : '-' + client.name)]) }}
    grant_types: ${{ client.grantTypes }}
    scope: ${{ scope }}
    redirect_uris:
      $if: ${{ client.?redirectUris.orValue([]).size() > 0 }}
      $value: ${{ client.redirectUris }}
    token_endpoint_auth_method:
      $if: ${{ public }}
      $value: none
  # With initialAccessToken, the Job authenticates to the registration endpoint
  # with a bearer token read from a Secret of the namespace: its name from
  # dcr.tokenSecret (default okdp-dcr-token), key token. The volume is the
  # kubelet's: the Job's Role does not read that Secret.
  tokenSecret: >-
    ${{ dcr.authMethod == 'initialAccessToken' ? dcr.?tokenSecret.orValue('okdp-dcr-token') : '' }}
  # The CA bundle the Job trusts: the client's, or the platform's.
  caSecret: ${{ first([client.?caSecret.orValue(''), dcr.caSecret]) }}
  # The image: the platform's parts over the default, always by digest
  # (oidc-clients.cel.yaml refuses a tag without one; a mirror that only
  # changes the registry or the repository keeps the digest).
  given: ${{ dcr.?image.orValue({}) }}
  registry: ${{ str(given.?registry.orValue('quay.io')) }}
  digest: >-
    ${{ str(given.?digest.orValue(has(given.tag) ? '' : 'sha256:38e21cbb15124b102b55581f74b30413633df98d291b2341a2d9a6fef480f06c')) }}
  image: >-
    ${{ (registry == '' ? '' : registry + '/') + str(given.?repository.orValue('adaltas/oidc-dcr-job')) + ':' + str(given.?tag.orValue('0.6.0')) + '@' + digest }}
  pullSecrets: >-
    ${{ given.?pullSecrets.orValue([]).map(s, {'name': s}) }}
  # The objects are named after the release, one set per client.
  fullname: ${{ names.fullname }}
  removal: ${{ names.fullname + '-delete' }}
  headlessName: ${{ names.fullname + '-headless' }}
  headlessCut: >-
    ${{ size(headlessName) > 63 ? headlessName.substring(0, 63) : headlessName }}
  headless: >-
    ${{ headlessCut.endsWith('-') ? headlessCut.substring(0, size(headlessCut) - 1) : headlessCut }}
  # The name label differs from the service's: no selector of the package's
  # Services takes these pods.
  podLabels:
    app.kubernetes.io/name: oidc-dcr
  objectLabels: ${{ okdpLabels('oidc-dcr') }}
  # Helm's and Argo CD's hooks of the objects a Job needs, before it.
  setupHook:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  removalHook:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  # What both Jobs mount: the script, the writable /tmp of a read-only root,
  # the CA bundle when there is one. An unset CA leaves the image's trust.
  volumes:
    - {name: script, configMap: {name: '${{ fullname }}'}}
    - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
    - $if: ${{ caSecret != '' }}
      $value: {name: ca, secret: {secretName: '${{ caSecret }}', defaultMode: 288}}
  mounts:
    - {name: script, mountPath: /etc/okdp/oidc-dcr, readOnly: true}
    - {name: tmp, mountPath: /tmp}
    - $if: ${{ caSecret != '' }}
      $value: {name: ca, mountPath: /etc/okdp/ca, readOnly: true}
  # What both Jobs are told; a Job's own settings come after.
  env:
    - {name: HOME, value: /tmp}
    - {name: SECRET_NAME, value: '${{ names.secret }}'}
    - name: NAMESPACE
      valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
  # A pod with the service account's token: only to write its one Secret.
  # The image's default user is root: the pod runs as nobody.
  pod:
    automountServiceAccountToken: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    imagePullSecrets:
      $if: ${{ size(pullSecrets) > 0 }}
      $value: ${{ pullSecrets }}
  container:
    name: oidc-dcr
    image: ${{ image }}
    imagePullPolicy: ${{ str(given.?pullPolicy.orValue('IfNotPresent')) }}
    command: [/bin/sh, /etc/okdp/oidc-dcr/oidc-dcr.sh]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
  registerEnv:
    - {name: MODE, value: register}
    - {name: PUBLIC, value: '${{ string(public) }}'}
    - {name: DCR_REGISTRATION_URL, value: '${{ dcr.registrationUrl }}'}
    - {name: REQUEST, value: '${{ toJson(request) }}'}
    - name: POD_IP
      valueFrom: {fieldRef: {fieldPath: status.podIP}}
    - {name: DNS_WAIT_TTL_SECONDS, value: "60"}
  # With an issuer, the Job waits for the provider's discovery document (one
  # trailing "/" of issuerUri dropped), waitTtlSeconds at most (600 by default).
  waitEnv:
    - $if: ${{ issuer != '' }}
      $value:
        name: DISCOVERY_URL
        value: >-
          ${{ (issuer.endsWith('/') ? issuer.substring(0, issuer.size() - 1) : issuer) + '/.well-known/openid-configuration' }}
    - $if: ${{ issuer != '' }}
      $value:
        name: WAIT_TTL_SECONDS
        value: >-
          ${{ string(int(dcr.?waitTtlSeconds.orValue(600.0))) }}
  # The registration's Job: the initial access token mounted when the
  # platform registers with one.
  registerJob:
    name: ${{ fullname }}
    component: oidc-dcr
    podLabels: ${{ podLabels }}
    annotations: {argocd.argoproj.io/sync-wave: "-5"}
    backoffLimit: ${{ dcr.backoffLimit }}
    ttlSecondsAfterFinished: ${{ dcr.ttlSeconds }}
    hook: {helm: 'pre-install,pre-upgrade', weight: -5, argocd: PreSync}
    pod:
      $merge: ${{ pod }}
      serviceAccountName: ${{ fullname }}
      volumes: >-
        ${{ volumes + (tokenSecret == '' ? [] : [{'name': 'token', 'secret': {'secretName': tokenSecret, 'defaultMode': 288, 'items': [{'key': 'token', 'path': 'token'}]}}]) }}
      containers:
        - $merge: ${{ container }}
          volumeMounts: >-
            ${{ mounts + (tokenSecret == '' ? [] : [{'name': 'token', 'mountPath': '/etc/okdp/token', 'readOnly': true}]) }}
          env: >-
            ${{ env + registerEnv + (tokenSecret == '' ? [] : [{'name': 'REGISTRATION_TOKEN_FILE', 'value': '/etc/okdp/token/token'}]) + waitEnv }}
  # The removal's Job, its own identity and script; no initial access token.
  removalJob:
    name: ${{ removal }}
    component: oidc-dcr
    podLabels: ${{ podLabels }}
    annotations: {argocd.argoproj.io/sync-wave: "-5"}
    backoffLimit: 1
    ttlSecondsAfterFinished: ${{ dcr.ttlSeconds }}
    activeDeadlineSeconds: 120
    hook: {helm: pre-delete, weight: -5, deletePolicy: 'before-hook-creation,hook-succeeded', argocd: PostDelete, argocdDeletePolicy: HookSucceeded}
    pod:
      $merge: ${{ pod }}
      serviceAccountName: ${{ removal }}
      volumes: >-
        ${{ volumes.map(v, v.name == 'script' ? {'name': 'script', 'configMap': {'name': removal}} : v) }}
      containers:
        - $merge: ${{ container }}
          volumeMounts: ${{ mounts }}
          env: >-
            ${{ env + [{'name': 'MODE', 'value': 'delete'}] }}
  # The script of both Jobs. It prints neither the provider's answers, nor
  # the client's secret, nor a token.
  script: |
    #!/bin/sh
    # Registers one OAuth client at the identity provider and keeps it as asked
    # (MODE=register), or removes it (MODE=delete). What it reads and answers
    # stays out of the logs: no response, no client secret, no token; a failure
    # prints the HTTP status and the error code of the provider.
    #
    # The Secret SECRET_NAME holds the client: client_id, client_secret unless
    # public, registration_client_uri, registration_access_token, the token of
    # the client's own registration (RFC 7592), rotated by the provider on a
    # change and written back here each time.
    set -u
    umask 077

    work=$(mktemp -d)
    trap 'rm -rf "$work"' EXIT
    body=$work/body
    headers=$work/headers
    manifest=$work/manifest
    CA_FILE=/etc/okdp/ca/ca.crt
    CURL_OPTION="--silent --max-time 30"
    [ -f "$CA_FILE" ] && CURL_OPTION="$CURL_OPTION --cacert $CA_FILE"

    log() { echo "$1: $2 ($SECRET_NAME)"; }
    fail() { log ERROR "$1"; exit 1; }

    # request METHOD URL TOKEN [FILE]: the HTTP status, 000 when the provider was
    # not reached; the answer in $body. The token goes through a file, never
    # through the arguments.
    request() {
      : >"$body"
      : >"$headers"
      [ -n "$3" ] && printf 'Authorization: Bearer %s\n' "$3" >"$headers"
      if [ -n "${4:-}" ]; then
        # shellcheck disable=SC2086
        curl $CURL_OPTION -X "$1" -H "@$headers" -H 'Content-Type: application/json' --data-binary "@$4" -o "$body" -w '%{http_code}' "$2" || true
      else
        # shellcheck disable=SC2086
        curl $CURL_OPTION -X "$1" -H "@$headers" -o "$body" -w '%{http_code}' "$2" || true
      fi
    }

    # The error code of the provider's answer, nothing else of it.
    reason() { jq -r '.error? // empty' "$body" 2>/dev/null | tr -cd 'a-zA-Z0-9_.-' | cut -c1-64; }

    # field KEY: a key of the Secret read in $current.
    field() { printf '%s' "$current" | jq -r --arg k "$1" '.data[$k] // "" | @base64d'; }

    # store: the client of $body written to the Secret, the keys the answer holds
    # (a change may not repeat them all).
    store() {
      data=$(jq -c --arg public "${PUBLIC:-false}" '
        {client_id, registration_client_uri, registration_access_token}
        + (if $public == "true" then {} else {client_secret} end)
        | with_entries(select(.value != null and .value != "")) | map_values(@base64)' "$body") \
        || fail 'the answer of the provider is not JSON'
      if [ -z "$current" ]; then
        jq -n --arg name "$SECRET_NAME" --arg namespace "$NAMESPACE" --argjson data "$data" \
          '{apiVersion: "v1", kind: "Secret", type: "Opaque", metadata: {name: $name, namespace: $namespace}, data: $data}' >"$manifest"
        kubectl create -f "$manifest" >/dev/null || fail 'the Secret could not be created'
      else
        jq -n --argjson data "$data" '{data: $data}' >"$manifest"
        kubectl patch secret "$SECRET_NAME" -n "$NAMESPACE" --type=merge --patch-file="$manifest" >/dev/null \
          || fail 'the Secret could not be changed'
      fi
    }

    # Whether the client of $body is as asked: each field the provider answers,
    # a list in any order; the scopes asked are among those it answers.
    as_asked() {
      printf '%s' "$REQUEST" >"$work/want"
      jq -e --slurpfile want "$work/want" '
        def norm: if type == "array" then sort else . end;
        . as $have | $want[0] | to_entries | all(
          .key as $k | .value as $v | ($have | has($k) | not)
          or (if $k == "scope" then ($v | split(" ")) - ($have.scope | split(" ")) == []
              else ($v | norm) == ($have[$k] | norm) end))' "$body" >/dev/null 2>&1
    }

    current=$(kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" --ignore-not-found -o json) \
      || fail 'the Secret could not be read'
    uri=''
    token=''
    id=''
    if [ -n "$current" ]; then
      uri=$(field registration_client_uri)
      token=$(field registration_access_token)
      id=$(field client_id)
    fi

    if [ "${MODE:-register}" = delete ]; then
      # Never fails: a failed pre-delete hook would stop the uninstall.
      if [ -z "$current" ]; then
        log INFO 'no Secret, nothing to remove'
        exit 0
      fi
      if [ -z "$uri" ] || [ -z "$token" ]; then
        log WARNING "the Secret has no registration token: client ${id:-unknown} stays at the provider, for an administrator to remove"
      else
        status=$(request DELETE "$uri" "$token")
        case $status in
          200|204|404) log INFO 'client removed' ;;
          401|403) log WARNING "the provider refused the registration token ($status): client $id stays at the provider, for an administrator to remove" ;;
          *)
            log WARNING "the client could not be removed ($status $(reason)): the Secret is kept, client $id stays at the provider"
            exit 0
            ;;
        esac
      fi
      kubectl delete secret "$SECRET_NAME" -n "$NAMESPACE" --ignore-not-found >/dev/null \
        || log WARNING 'the Secret could not be removed'
      exit 0
    fi

    # Providers with a trusted hosts policy reverse-resolve the IP of the caller:
    # the record of the pod, published by the headless Service, comes after the
    # pod starts.
    if [ "${DNS_WAIT_TTL_SECONDS:-0}" -gt 0 ] && [ -n "${POD_IP:-}" ]; then
      deadline=$(($(date +%s) + DNS_WAIT_TTL_SECONDS))
      until nslookup "$POD_IP" 2>/dev/null | grep -q 'name = '; do
        [ "$(date +%s)" -ge "$deadline" ] && fail "no reverse DNS record for $POD_IP after $DNS_WAIT_TTL_SECONDS seconds"
        sleep 1
      done
    fi

    # The provider may still be starting: an error page is not an answer.
    if [ -n "${DISCOVERY_URL:-}" ]; then
      deadline=$(($(date +%s) + ${WAIT_TTL_SECONDS:-600}))
      # shellcheck disable=SC2086
      until curl $CURL_OPTION -f "$DISCOVERY_URL" | jq -e .issuer >/dev/null 2>&1; do
        [ "$(date +%s)" -ge "$deadline" ] && fail "$DISCOVERY_URL did not answer in ${WAIT_TTL_SECONDS:-600} seconds"
        sleep 5
      done
    fi

    if [ -n "$uri" ] && [ -n "$token" ]; then
      status=$(request GET "$uri" "$token")
      case $status in
        200)
          if as_asked; then
            # The provider may have given the token a new signature.
            [ "$(jq -r '.registration_access_token // empty' "$body")" = "$token" ] || store
            log INFO 'client registered, as asked'
            exit 0
          fi
          jq --slurpfile want "$work/want" '. + $want[0]
            | del(.registration_access_token, .registration_client_uri, .client_secret, .client_secret_expires_at, .client_id_issued_at)' "$body" >"$work/update"
          status=$(request PUT "$uri" "$token" "$work/update")
          [ "$status" = 200 ] || fail "the client could not be changed: $status $(reason)"
          store
          log INFO 'client changed'
          exit 0
          ;;
        404) log WARNING "client $id is gone from the provider: registering it again" ;;
        401|403) log WARNING "the provider refused the registration token ($status): registering a new client, $id stays at the provider, for an administrator to remove" ;;
        *) fail "the provider did not answer: $status $(reason)" ;;
      esac
    fi

    initial=''
    if [ -n "${REGISTRATION_TOKEN_FILE:-}" ] && [ -f "$REGISTRATION_TOKEN_FILE" ]; then
      initial=$(cat "$REGISTRATION_TOKEN_FILE")
    fi
    printf '%s' "$REQUEST" >"$work/request"
    status=$(request POST "$DCR_REGISTRATION_URL" "$initial" "$work/request")
    case $status in
      200|201) ;;
      *) fail "the registration failed: $status $(reason)" ;;
    esac
    store
    log INFO 'client registered'

values:
  objects:
    # The registration.
    - apiVersion: v1
      kind: ServiceAccount
      metadata: {name: '${{ fullname }}', labels: '${{ objectLabels }}', annotations: '${{ setupHook }}'}
      automountServiceAccountToken: false
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: '${{ fullname }}', labels: '${{ objectLabels }}', annotations: '${{ setupHook }}'}
      rules:
        # create cannot be limited by name, Kubernetes authorizes it before
        # the name is known: this Role creates a Secret of any name in the
        # namespace. It reads and changes only the client's own.
        - apiGroups: [""]
          resources: [secrets]
          verbs: [create]
        - apiGroups: [""]
          resources: [secrets]
          resourceNames: ['${{ names.secret }}']
          verbs: [get, patch]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: '${{ fullname }}', labels: '${{ objectLabels }}', annotations: '${{ setupHook }}'}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: '${{ fullname }}'}
      subjects:
        - {kind: ServiceAccount, name: '${{ fullname }}'}
    - apiVersion: v1
      kind: ConfigMap
      metadata: {name: '${{ fullname }}', labels: '${{ objectLabels }}', annotations: '${{ setupHook }}'}
      data:
        oidc-dcr.sh: ${{ script }}
    # Providers with a trusted hosts policy reverse-resolve the IP of the Job's
    # pod, which sends its request before being ready.
    - apiVersion: v1
      kind: Service
      metadata: {name: '${{ headless }}', labels: '${{ objectLabels }}', annotations: '${{ setupHook }}'}
      spec:
        clusterIP: None
        publishNotReadyAddresses: true
        selector:
          job-name: ${{ fullname }}
        ports:
          - {port: 80, protocol: TCP, targetPort: 80}
    - $spread: ${{ okdpJob(registerJob) }}
    # The removal: Secret and client gone when the release goes. It never
    # fails, a failed pre-delete hook would stop the uninstall. Without the
    # Secret, or with a token the provider refuses, the client stays at the
    # provider, named in the Job's log, for an administrator to remove.
    - apiVersion: v1
      kind: ServiceAccount
      metadata: {name: '${{ removal }}', labels: '${{ objectLabels }}', annotations: '${{ removalHook }}'}
      automountServiceAccountToken: false
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: '${{ removal }}', labels: '${{ objectLabels }}', annotations: '${{ removalHook }}'}
      rules:
        - apiGroups: [""]
          resources: [secrets]
          resourceNames: ['${{ names.secret }}']
          verbs: [get, delete]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: '${{ removal }}', labels: '${{ objectLabels }}', annotations: '${{ removalHook }}'}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: '${{ removal }}'}
      subjects:
        - {kind: ServiceAccount, name: '${{ removal }}'}
    - apiVersion: v1
      kind: ConfigMap
      metadata: {name: '${{ removal }}', labels: '${{ objectLabels }}', annotations: '${{ removalHook }}'}
      data:
        oidc-dcr.sh: ${{ script }}
    - $spread: ${{ okdpJob(removalJob) }}
