# A key of the upstream values of an instance of a project that is not
# privileged. Input: key, value, at (its path, for the message), ns,
# added (what the platform adds to the denied keys).
vars:
  own: "the platform's projects set it (global.okdp.policy.privileged), ${{ ns }} is not one of them"
errors:
  - $if: ${{ key in sets.deniedUpstreamKeys }}
    $value: "${{ at }}: ${{ key }} is denied to the instance's upstream values (a pod's privileges, identity, containers or objects): ${{ own }}"
  - $if: ${{ key in added }}
    $value: "${{ at }}: ${{ key }} is denied to the instance's upstream values (global.okdp.policy.upstream.deny): ${{ own }}"
  - $if: ${{ key == "runAsUser" && (value == 0.0 || value == "0") }}
    $value: "${{ at }}: runAsUser 0, root, is denied to the instance's upstream values: ${{ own }}"
  - $if: ${{ key == "runAsNonRoot" && (value == false || value == "false") }}
    $value: "${{ at }}: runAsNonRoot false is denied to the instance's upstream values: ${{ own }}"
