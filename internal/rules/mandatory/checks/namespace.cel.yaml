# Hook namespace: a namespace that is no project's, whatever the platform
# and the host: platform, whose keys of the secret store the claims'
# credentials go through, and Kubernetes' own. Not default: a project may
# be named so. Input: field, ns, settings.
errors:
  - $if: ${{ ns == "platform" }}
    $value: "${{ field }} ${{ quote(ns) }}: the namespace is reserved: platform/ holds the platform's keys of the secret store, which no project writes"
  - $if: ${{ ns.startsWith("kube-") }}
    $value: "${{ field }} ${{ quote(ns) }}: the namespace is reserved: kube-* is Kubernetes' own (kube-system, kube-public, kube-node-lease)"
