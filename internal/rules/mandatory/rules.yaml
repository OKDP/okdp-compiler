# The compiler's mandatory rule set: what a compile needs to write values a
# chart installs, applied to every compile. It holds the functions, the
# templates and the names of a mapping; it refuses nothing. What a platform
# refuses is another rule set, given to the compile (LoadRules, --rules):
# both apply, and that one adds to this one without replacing any of it.
apiVersion: okdp-compiler/rules.v1
version: 1.0.0
tables:
  # The paths of the context a level gives whole, or not at all: * stands for
  # one key. A level may not change them piecemeal.
  wholePaths:
    values:
      - connections.*
      - claims.*
      - global.okdp.provisioning.*.classes.*
      - global.okdp.provisioning.*.default
  # The keys of global.okdp a level above 0 may set, read as the platform's
  # settings: the classes a project adds.
  projectPlatformKeys:
    values: [provisioning]
  # The roles of a project's groups, least first.
  projectRoles:
    values: [viewer, editor, admin]
# The JSON schema of the platform's settings, and their defaults.
schemas:
  platform: schemas/platform.schema.json
# The functions mappings call: each a fragment, a template evaluated on its
# arguments, checked against the mapping schema under the function's name,
# and the instance's context; result names the value it returns, all of them
# when left out.
functions:
  okdpPodSpec: {fragment: fragments/fragment-pod.cel.yaml, result: spec}
  okdpJob: {fragment: fragments/fragment-job.cel.yaml, result: objects}
  okdpSignInProxy: {fragment: fragments/fragment-proxy.cel.yaml}
  okdpWebWorkload: {fragment: fragments/fragment-web.cel.yaml, result: objects}
  oidcClientSecret: {document: oidcSecret, result: secret}
# The compiler's own templates: the objects of a generated Secret, and those
# that register an OAuth client.
templates:
  generatedSecret: fragments/generated-secret.cel.yaml
  oidcClient: charts/oidc-dcr.cel.yaml
# The sections of a mapping besides the compiler's own (output, instance,
# provides, objects).
sections: [oidcClients]
# Documents the others call: rule(<name>, input) in a document, a function of
# functions, scope (what a mapping sees as platform).
documents:
  oidcSecret: functions/oidc-secret.cel.yaml
  oidcClients: charts/oidc-clients.cel.yaml
  scope: scope.cel.yaml
  secretStore: objects/secret-store.cel.yaml
  pushSecret: objects/push-secret.cel.yaml
  pullSecret: objects/pull-secret.cel.yaml
# A section whose items add objects: list gives them, objects the template
# of the objects of each it says to render.
ownObjects:
  - {section: oidcClients, list: oidcClients, objects: oidcClient}
# The names the compiler gives credentials: $<word> stands for the value.
names:
  credentialsSecret: $output-$contract-credentials
  connectionSecret: $release.$connection-credentials
  claimSecret: $release-$secret
  credentialsLabel: okdp.io/credentials-$contract
# An object Helm keeps is kept alike by Argo CD, which reads none of Helm's
# annotations: its sync options are added, unless it sets one of that name.
keepSync:
  annotation: helm.sh/resource-policy
  value: keep
  syncOptions: argocd.argoproj.io/sync-options
  options: [Prune=false, Delete=false]
# The labels of OKDP's objects: $service and $release stand for the instance's.
labels:
  selector:
    app.kubernetes.io/name: $service
    app.kubernetes.io/instance: $release
  component: app.kubernetes.io/component
  common:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: okdp
    okdp.io/instance: $release
    okdp.io/service: $service
