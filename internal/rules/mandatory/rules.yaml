# The compiler's mandatory rule set, applied to every compile: what a
# compile needs to write values a chart installs (the templates and the
# names of a mapping), and the few namespaces it refuses (the namespace
# hook's document), as data. The rule sets given to the compile
# (LoadRules, --rules) add to this one without replacing any of it. What a
# platform's policy refuses (cluster-scoped objects, credentials in clear,
# the namespaces it reserves) is the security set's; the namespaces and
# the names of the objects a host writes are the host's set's.
apiVersion: okdp-compiler/rules.v1
name: core
version: 1.0.0
# The documents the compiler calls at its hooks, each a document of vars
# and errors (the mapping language), the first message refusing: the
# namespace of every instance. They see their input and sets, each table
# of the sets as a set, and tables, as a list.
hooks:
  namespace: [namespace]
# The JSON schemas of the platform's settings, and their defaults, and of
# what a mapping writes.
schemas:
  platform: schemas/platform.schema.json
  mapping: schemas/mapping.schema.json
# The charts the compiler adds: objects, overridden by
# global.okdp.charts.objects.
charts:
  objects: {repository: oci://quay.io/okdp/charts, chart: okdp-objects, version: 0.1.0}
# The functions of mappings: okdpGeneratedSecret, the objects of a generated
# Secret, which the compiler also renders for a provides secret's generate.
functions:
  okdpGeneratedSecret: {fragment: fragments/generated-secret.cel.yaml, result: objects}
# Documents the others call: rule(<name>, input) in a document, a function of
# a set's functions, a hook, scope (what a mapping sees as platform);
# secretStore, which a host also reads, the store it writes in each
# project's namespace.
documents:
  namespace: checks/namespace.cel.yaml
  scope: scope.cel.yaml
  secretStore: objects/secret-store.cel.yaml
  pushSecret: objects/push-secret.cel.yaml
  pullSecret: objects/pull-secret.cel.yaml
# The documents that compute what a mapping sees as platform, from the
# platform's settings and the release: those of every set, in the order
# the sets are read, their platform merged.
scopes: [scope]
# The names the compiler gives credentials: $<word> stands for the value.
names:
  credentialsSecret: $output-$contract-credentials
  connectionSecret: $release.$connection-credentials
  claimSecret: $release-$secret
  credentialsLabel: okdp.io/credentials-$contract
# The labels of OKDP's objects: $service and $release stand for the instance's.
labels:
  selector:
    app.kubernetes.io/name: $service
    app.kubernetes.io/instance: $release
  component: app.kubernetes.io/component
  common:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: okdp
    okdp.io/instance: $release
    okdp.io/service: $service
