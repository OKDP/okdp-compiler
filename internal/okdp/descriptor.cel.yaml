# The descriptor ConfigMap <release>-okdp (cut as okdpFullname) of an
# instance: service, version, url, usage, and the connections the instance
# provides (outputs.yaml), which the console lists and other instances
# reference by name.
#
# Embedded in the compiler and evaluated once per compile (descriptor.go)
# by the mapping engine: ${{ CEL }} expressions, the same directives and
# functions.
#
# Inputs, besides the mapping's context (release, service, labels...):
#   instance  the mapping's instance section, checked: url, usage
#   outputs   its provides, each checked against its contract: name (the
#             release's when the mapping names none), contract, values,
#             secretRef
errors:
  - $for: o in outputs.map(o, [o.contract, o.name]).distinct()
    $each:
      $if: ${{ outputs.filter(x, x.contract == o[0] && x.name == o[1]).size() > 1 }}
      $value: 'two ${{ o[0] }} outputs are named ${{ quote(o[1]) }}'

values:
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: ${{ okdpFullname('okdp') }}
    namespace: ${{ release.namespace }}
    # The labels of OKDP's objects, plus one per provided contract.
    labels:
      $for: l in labels.transformList(k, v, [k, v]) + outputs.map(o, ['okdp.io/provides-' + o.contract, 'true'])
      $key: ${{ l[0] }}
      $value: ${{ l[1] }}
  data:
    service: ${{ service.name }}
    version: ${{ service.version }}
    url: ${{ instance.?url.orValue('').trim() }}
    usage: ${{ instance.?usage.orValue('').trim() + '\n' }}
    # Helm's toYaml, its final newline kept.
    outputs.yaml: ${{ toYaml(outputs) + '\n' }}
