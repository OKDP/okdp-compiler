# The notes of a mapping: a shared note is only for a namespace
# settings.trusted lists, and its text names no word of settings.banned.
# Input: items, release, platform, settings.
vars:
  trusted: ${{ release.namespace in asList(settings.?trusted.orValue([])) }}
  banned: ${{ asList(settings.?banned.orValue([])) }}
errors:
  - $for: i in lists.range(size(items))
    $each:
      $if: ${{ !trusted && truthy(items[i].?shared.orValue(false)) }}
      $value: "notes[${{ string(i) }}]: a shared note is a trusted namespace's (global.okdp.trusted)"
  - $for: i in lists.range(size(items))
    $vars:
      words: ${{ fields(str(items[i].?text.orValue("")), " ,") }}
    $each:
      $if: ${{ words.exists(w, w in banned) }}
      $value: "notes[${{ string(i) }}]: a word of global.okdp.banned"
values:
  items:
    - $for: i in lists.range(size(items))
      $each:
        of: notes[${{ string(i) }}]
        render: true
        client: ${{ items[i] }}
        names: {}
