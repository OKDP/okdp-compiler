# A values layer of an instance: parameters and upstream values, no global
# but the keys its package's schema declares. Input: name, layer, declared.
vars:
  global: ${{ asMap(dig(layer, "global")) }}
  notMap: ${{ "global" in layer && type(layer.global) != map }}
errors:
  - $if: ${{ notMap }}
    $value: "${{ name }}: global is set by the context (Inputs.Context)"
  - $for: k in keys(global)
    $each:
      $if: ${{ !(k in declared) || k == "okdp" }}
      $value: "${{ name }}: global.${{ k }} is set by the context (Inputs.Context)"
  - $if: ${{ "connections" in layer }}
    $value: "${{ name }}: connections are given by the context (Inputs.Context): an instance's own in a context layer of its level"
  - $if: ${{ "claims" in layer }}
    $value: "${{ name }}: claims are declared by the context (Inputs.Context): a project's, of level 1 or above"
  - $if: ${{ "access" in layer }}
    $value: "${{ name }}: access is the project's, its file's (the context at level 1)"
