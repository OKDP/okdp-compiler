# No credential in clear in an object: no Secret holds values, no
# ExternalSecret a literal at a sensitive key, no Fake generator values. The
# value is never printed. Input: svc, object.
vars:
  advice: "credentials are generated (okdpGeneratedSecret) or read from the platform's secret store (an ExternalSecret); Inputs.AllowPlainSecrets allows it"
  id: ${{ object.kind + "/" + object.name }}
  secret: ${{ object.kind == "Secret" && object.group == "" }}
  template: >-
    ${{ object.group != "external-secrets.io" ? ""
      : object.kind == "ExternalSecret" ? "spec.target.template.data"
      : object.kind == "ClusterExternalSecret" ? "spec.externalSecretSpec.target.template.data" : "" }}
  fake: >-
    ${{ object.group != "generators.external-secrets.io" ? ""
      : object.kind == "Fake" ? "spec.data"
      : object.kind == "ClusterGenerator" && str(dig(object.raw, "spec.kind")) == "Fake" ? "spec.generator.fakeSpec.data" : "" }}
  data: >-
    ${{ template == "" ? null : dig(object.raw, template) }}
errors:
  - $if: ${{ secret && size(keys(dig(object.raw, "data"))) > 0 }}
    $value: "${{ svc }}: objects: Secret/${{ object.name }}: a plain value (data): ${{ advice }}"
  - $if: ${{ secret && size(keys(dig(object.raw, "stringData"))) > 0 }}
    $value: "${{ svc }}: objects: Secret/${{ object.name }}: a plain value (stringData): ${{ advice }}"
  - $for: k in keys(data)
    $each:
      $if: ${{ sensitive(k) && !credentialReference(k) && credentialLiteral(data[k]) }}
      $value: "${{ svc }}: objects: ${{ id }}: a plain value (${{ pathKey(template, k) }}): a literal at a sensitive key, not a template of what the store or a generator gives; ${{ advice }}"
  - $if: ${{ fake != "" && size(keys(dig(object.raw, fake))) > 0 }}
    $value: "${{ svc }}: objects: ${{ id }}: a plain value (${{ fake }}): a Fake generator gives the values it holds; ${{ advice }}"
