# The ExternalSecret that reads credentials from the platform's secret store
# into a Secret of the instance's namespace, each secret field a property of
# the key. Input: arg (secret, key, fields, labels, namespace), settings
# (store).
values:
  object:
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: ${{ arg.secret }}
      namespace: ${{ arg.namespace }}
      labels: ${{ arg.labels }}
    spec:
      refreshInterval: ${{ settings.refreshInterval }}
      secretStoreRef: ${{ settings.ref }}
      target:
        name: ${{ arg.secret }}
        creationPolicy: Owner
        template:
          metadata:
            labels: ${{ arg.labels }}
      data:
        - $for: f in arg.fields
          $each:
            secretKey: ${{ f }}
            remoteRef:
              key: ${{ arg.key }}
              property: ${{ f }}
