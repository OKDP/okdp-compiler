# The platform's secret store, of global.okdp.secrets. store: what the
# targets write in each project's namespace, when the platform gives its
# provider. ref: how the PushSecrets and the ExternalSecrets name it. Input:
# settings.
vars:
  name: ${{ str(dig(settings, "secrets.store")) }}
  provider: ${{ asMap(dig(settings, "secrets.provider")) }}
  own: ${{ name != "" && size(keys(provider)) > 0 }}
  account: ${{ str(dig(settings, "secrets.serviceAccount")) }}
  interval: ${{ str(dig(settings, "secrets.refreshInterval")) }}
values:
  store:
    $if: ${{ own }}
    name: ${{ name }}
    provider: ${{ provider }}
    serviceAccount: >-
      ${{ account != "" ? account : "okdp-secrets" }}
  ref:
    name: ${{ name }}
    kind: >-
      ${{ own ? "SecretStore" : "ClusterSecretStore" }}
  refreshInterval: >-
    ${{ interval != "" ? interval : "1h" }}
