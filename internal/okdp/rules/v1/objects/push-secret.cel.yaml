# The PushSecret of the credentials of a claim of another namespace: the
# Secret of its output pushed to the platform's secret store, each secret
# field a property of its key, deleted from the store when the claim is gone.
# Input: arg (id, key, secret, fields, labels, namespace), settings (store).
values:
  object:
    apiVersion: external-secrets.io/v1alpha1
    kind: PushSecret
    metadata:
      name: ${{ arg.id }}
      namespace: ${{ arg.namespace }}
      labels: ${{ arg.labels }}
    spec:
      refreshInterval: ${{ settings.refreshInterval }}
      updatePolicy: Replace
      deletionPolicy: Delete
      secretStoreRefs:
        - ${{ settings.ref }}
      selector:
        secret:
          name: ${{ arg.secret }}
      data:
        - $for: f in arg.fields
          $each:
            match:
              secretKey: ${{ f }}
              remoteRef:
                remoteKey: ${{ arg.key }}
                property: ${{ f }}
