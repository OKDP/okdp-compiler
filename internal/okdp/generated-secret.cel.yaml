# The objects of okdpGeneratedSecret(args): a Secret whose random values
# External Secrets Operator generates in the cluster, with Password
# generators: Helm must render the same objects on every run (Argo CD
# renders with helm template). One generators.external-secrets.io/v1alpha1
# Password per key, then the ExternalSecret writing the Secret args.name.
#
# Embedded in the compiler and evaluated at each call (generatedSecret,
# mapping.go), for the CEL function and for the credentials Secrets of
# provides (provides.go), by the mapping engine: ${{ CEL }} expressions,
# the same directives and functions.
#
# Inputs:
#   args     the arguments, checked against mapping.schema.json
#            (okdpGeneratedSecret): an empty value takes the default, as
#            Helm's default does
#   release  the instance: name, namespace
#   labels   the labels of OKDP's objects (okdpLabels(''))
vars:
  ns: ${{ first([args.?namespace.orValue(''), release.namespace]) }}
  annotations: ${{ args.?annotations.orValue({}) }}
  # Per key: its Password, named <name>-<key> (lowercased, "_" and "." as
  # "-"); past 63 characters, cut to 54 (no trailing "-") and suffixed with
  # 8 hex characters of the key's SHA-256. Its spec: length (32, 0
  # included), digits (6, unless given), symbols (0), noUpper (false).
  keys: >-
    ${{ args.?keys.orValue([]).map(k, cel.bind(g, args.name + '-' + k.key.lowerAscii().replace('_', '-').replace('.', '-'),
        {'key': k.key, 'transform': k.?transform.orValue(''),
         'name': g.size() <= 63 ? g : cel.bind(c, g.substring(0, 54), (c.endsWith('-') ? c.substring(0, 53) : c) + '-' + sha256(k.key).substring(0, 8)),
         'spec': {'length': first([k.?length.orValue(0.0), 32.0]), 'digits': k.?digits.orValue(6.0),
                  'symbols': k.?symbols.orValue(0.0), 'noUpper': k.?noUpper.orValue(false), 'allowRepeat': true}})) }}
  # The Secret's data: the static keys, as text (a value with "{{" as a
  # template string literal), then the generated ones, which replace a
  # static key of the same name.
  data: >-
    ${{ args.?stringData.orValue({}).transformList(k, v, cel.bind(s, str(v), {'k': k, 'v': s.contains('{{') ? '{{ ' + quote(s) + ' }}' : s}))
        + keys.map(k, {'k': k.key, 'v': '{{ index . ' + quote(k.key) + {'sha256': ' | sha256sum', 'b64enc': ' | b64enc'}[?k.transform].orValue('') + ' }}'}) }}
  # The ExternalSecret, and the Secret it writes, carry the extra labels.
  esLabels:
    $for: l in labels.transformList(k, v, [k, v]) + args.?labels.orValue({}).transformList(k, v, [k, v])
    $key: ${{ l[0] }}
    $value: ${{ l[1] }}

# Two keys giving one generator name.
errors:
  - $for: g in keys.map(k, k.name).distinct()
    $each:
      $if: ${{ keys.filter(k, k.name == g).size() > 1 }}
      $value: >-
        okdpGeneratedSecret: ${{ args.name }}: keys ${{ keys.filter(k, k.name == g).map(k, quote(k.key)).join(' and ') }}
        give the same generator name ${{ quote(g) }}

values:
  objects:
    - $for: k in keys
      $each:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        metadata:
          name: ${{ k.name }}
          namespace: ${{ ns }}
          labels: ${{ labels }}
          annotations: {$if: "${{ annotations.size() > 0 }}", $value: "${{ annotations }}"}
        spec: ${{ k.spec }}
    - apiVersion: ${{ first([args.?apiVersion.orValue(''), 'external-secrets.io/v1']) }}
      kind: ExternalSecret
      metadata:
        name: ${{ args.name }}
        namespace: ${{ ns }}
        labels: ${{ esLabels }}
        annotations: {$if: "${{ annotations.size() > 0 }}", $value: "${{ annotations }}"}
      spec:
        # "0": generated once.
        refreshInterval: ${{ first([args.?refreshInterval.orValue(''), '0']) }}
        target:
          name: ${{ args.name }}
          creationPolicy: Owner
          template:
            engineVersion: v2
            type: {$if: "${{ args.?type.orValue('') != '' }}", $value: "${{ args.type }}"}
            metadata: {labels: "${{ esLabels }}"}
            data:
              $for: d in data
              $key: ${{ d.k }}
              $value: ${{ d.v }}
        dataFrom:
          - $for: k in keys
            $each:
              sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: "${{ k.name }}"}}
              rewrite: [{regexp: {source: ^password$, target: "${{ k.key }}"}}]
