# The OAuth clients of a mapping's oidcClients section, checked in every
# mode: one main client at most, unique names, a secret given named
# <release>-..., no URL the provider trusts through request. In dcr mode the
# platform must register them, and no two clients write one Secret. What
# each gives the compiler (ownObjects, objects.go): of, for its messages;
# render, whether its objects are compiled (charts/oidc-dcr.cel.yaml, on
# client and names); urls, the URLs a project that is not privileged must
# serve. Input: items, release, platform.
vars:
  names: ${{ items.map(c, str(c.?name.orValue(""))) }}
  indexes: ${{ lists.range(size(items)) }}
  where: >-
    ${{ indexes.map(i, "oidcClients[" + string(i) + "]" + (names[i] == "" ? "" : " (" + names[i] + ")")) }}
  dcr: ${{ platform.oidc.dcr.enabled }}
  auth: ${{ str(platform.oidc.dcr.?authMethod.orValue("")) }}
  url: ${{ platform.oidc.dcr.?registrationUrl.orValue(null) }}
  objects: >-
    ${{ names.map(n, n == "" ? "oidc-dcr" : n + "-oidc-dcr") }}
  # The fields of a registration request that name a URL the provider trusts,
  # which only redirectUris sets: checked there, never widened here.
  trusted:
    - redirect_uris
    - post_logout_redirect_uris
    - request_uris
    - sector_identifier_uri
    - jwks_uri
    - initiate_login_uri
    - backchannel_logout_uri
    - frontchannel_logout_uri
  given: ${{ items.map(c, str(c.?secret.orValue(""))) }}
  secrets: >-
    ${{ indexes.map(i, given[i] != "" ? given[i] : rule("oidcSecret", {"arg": names[i], "release": release, "platform": platform}).secret) }}
errors:
  # The Job's Role changes this Secret only, by name (it can create one of
  # any name: Kubernetes does not limit create by name): the release's,
  # exactly, so that no client is written over another instance's credentials.
  - $for: i in indexes
    $vars:
      same: ${{ indexes.filter(j, j < i && names[j] == names[i]) }}
      want: >-
        ${{ release.name + "-" + (names[i] == "" ? "oidc" : names[i]) }}
    $each:
      $if: ${{ size(same) > 0 || (given[i] != "" && given[i] != want) }}
      $value: >-
        ${{ size(same) > 0 && names[i] == "" ? where[i] + ": " + where[same[0]] + " has no name either: only the service's main client (chart oidc-dcr) has none, name the others"
          : size(same) > 0 ? where[i] + ": " + where[same[0]] + " has the same name: client names must be unique"
          : where[i] + ": secret " + quote(given[i]) + ": the Secret the client is written to is the release's, " + quote(want) + " (<release>-<client name>, <release>-oidc for the main client)" }}
  - $for: i in indexes
    $vars:
      request: ${{ asMap(items[i].?request.orValue({})) }}
      asked: ${{ trusted.filter(k, k in request) }}
    $each:
      $if: ${{ size(asked) > 0 }}
      $value: >-
        ${{ where[i] + ": request." + asked[0] + ": a URL the provider trusts is not set through request" + (asked[0] == "redirect_uris" ? ": use redirectUris, whose hosts are checked" : "") }}
  - $if: ${{ size(items) > 0 && dcr && has(platform.oidc.dcr.image) && has(platform.oidc.dcr.image.tag) && str(platform.oidc.dcr.image.?digest.orValue("")) == "" }}
    $value: 'global.okdp.oidc.dcr.image: tag ${{ str(platform.oidc.dcr.image.tag) }} without a digest: the Jobs run by digest, give it too'
  - $if: ${{ size(items) > 0 && dcr && !(auth in ["anonymous", "initialAccessToken"]) }}
    $value: 'global.okdp.oidc.dcr.authMethod ${{ quote(auth) }} is not supported: anonymous or initialAccessToken'
  - $if: ${{ size(items) > 0 && dcr && (type(url) != string || url == "") }}
    $value: 'global.okdp.oidc.dcr.registrationUrl is required (clientProvisioning: dcr): the endpoint the oidc-dcr Jobs register the OAuth clients at'
  - $for: "i in dcr ? indexes : []"
    $vars:
      same: ${{ indexes.filter(j, j < i && secrets[j] == secrets[i]) }}
    $each:
      $if: ${{ size(same) > 0 }}
      $value: '${{ where[i] }}: ${{ where[same[0]] }} writes the same Secret, ${{ quote(secrets[i]) }}: give each client its own secret'
values:
  items:
    - $for: i in indexes
      $vars:
        full: ${{ release.name + "-" + objects[i] }}
        cut: >-
          ${{ size(full) > 56 ? full.substring(0, 56) : full }}
      $each:
        of: ${{ where[i] }}
        render: ${{ dcr }}
        urls: ${{ asList(items[i].?redirectUris.orValue([])) }}
        client: >-
          ${{ merge(items[i], {"name": names[i]}) }}
        names:
          fullname: >-
            ${{ cut.endsWith("-") ? cut.substring(0, size(cut) - 1) : cut }}
          secret: ${{ secrets[i] }}
