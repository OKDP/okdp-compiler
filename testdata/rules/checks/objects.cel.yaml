# An object of an instance of a project that is not privileged: it stays in
# the namespace, of no cluster-scoped kind, of none of the deployer's. Input:
# svc, ns, object.
errors:
  - $if: ${{ object.group + "/" + object.kind in sets.clusterScopedKinds }}
    $value: "${{ svc }}: objects: ${{ object.id }}: a cluster-scoped kind (${{ object.apiVersion }}): the platform's projects install cluster-scoped objects (global.okdp.policy.privileged), ${{ ns }} is not one of them"
  - $if: ${{ object.group in sets.deployerApiGroups }}
    $value: "${{ svc }}: objects: ${{ object.id }}: an object of the deployer's kinds (${{ object.apiVersion }}) lets a project drive the platform's engine: the platform's projects set it (global.okdp.policy.privileged), ${{ ns }} is not one of them"
  - $if: ${{ object.ns != null && object.ns != "" && object.ns != ns }}
    $value: "${{ svc }}: objects: ${{ object.id }}: namespace ${{ str(object.ns) }}, not the instance's (${{ ns }}): the platform's projects write other namespaces (global.okdp.policy.privileged), ${{ ns }} is not one of them"
  - $if: ${{ object.group == "" && object.kind == "Service" && "spec" in object.raw && object.raw.spec != null && "externalIPs" in object.raw.spec && object.raw.spec.externalIPs != null && size(object.raw.spec.externalIPs) > 0 }}
    $value: "${{ svc }}: objects: ${{ object.id }}: spec.externalIPs claims addresses the cluster forwards to the Service (CVE-2020-8554, traffic interception): the platform's projects set it (global.okdp.policy.privileged), ${{ ns }} is not one of them"
