# A host a project serves: one the platform lists for it, or exactly one
# DNS label, then the namespace, then the suffix: <label>.<namespace>.<suffix>
# (the rule of the host: one name, a namespace and a suffix; no other project
# can reach it from the root, no deeper name widens it). Input: at (where it
# is, for the message), raw (as written), host (lower case, no final dot), ns,
# suffix (global.okdp.ingress.suffix), listed (the hosts listed for it).
vars:
  tail: ${{ "." + ns + "." + suffix }}
  matches: ${{ suffix != "" && host.endsWith(tail) && host.substring(0, size(host) - size(tail)).matches("^[a-z0-9]([-a-z0-9]*[a-z0-9])?$") }}
  form: >-
    ${{ suffix == "" ? "any host, global.okdp.ingress.suffix being unset, but those listed" : "a host <label>" + tail + " (one DNS label)" }}
errors:
  - $if: ${{ !(host in listed) && !matches }}
    $value: "${{ at }}: host ${{ quote(raw) }} is not served by ${{ ns }}: ${{ form }}, or one listed for it in global.okdp.policy.ingressHosts; the platform's projects serve any host (global.okdp.policy.privileged), ${{ ns }} is not one of them"
