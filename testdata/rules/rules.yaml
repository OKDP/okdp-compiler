# The standard rule set of an OKDP platform: what the compiler refuses and
# what it knows of the platform's names, as data. It applies on top of the
# compiler's mandatory rule set (the functions, the templates and the names
# of a mapping), to which it adds and of which it replaces nothing. A table
# with addFrom also reads the list global.okdp.<addFrom>: the platform adds to
# the table, it never removes from it.
apiVersion: okdp-compiler/rules.v1
version: 1.0.0
tables:
  # The namespaces of the deployer engines and of the objects the targets
  # write in them, which no project may have: a project's releases are
  # installed with every verb of its namespace, and there they would rewrite
  # the engine's sources, its Applications or HelmReleases, the other
  # projects' identities.
  engineNamespaces:
    values: [argocd, flux-system, okdp-releases]
  # The well-known cluster-scoped kinds, <group>/<kind>, the group of the
  # apiVersion, empty for the core group: Kubernetes' own, and those of the
  # operators OKDP's packages install objects of or that commonly run beside
  # them. A kind that is not listed is assumed namespaced: the engine's
  # identity, confined to the namespace, refuses it in the cluster.
  clusterScopedKinds:
    values:
      - /Namespace
      - /Node
      - /PersistentVolume
      - storage.k8s.io/StorageClass
      - storage.k8s.io/CSIDriver
      - storage.k8s.io/CSINode
      - storage.k8s.io/VolumeAttachment
      - storage.k8s.io/VolumeAttributesClass
      - rbac.authorization.k8s.io/ClusterRole
      - rbac.authorization.k8s.io/ClusterRoleBinding
      - apiextensions.k8s.io/CustomResourceDefinition
      - admissionregistration.k8s.io/ValidatingWebhookConfiguration
      - admissionregistration.k8s.io/MutatingWebhookConfiguration
      - admissionregistration.k8s.io/ValidatingAdmissionPolicy
      - admissionregistration.k8s.io/ValidatingAdmissionPolicyBinding
      - admissionregistration.k8s.io/MutatingAdmissionPolicy
      - admissionregistration.k8s.io/MutatingAdmissionPolicyBinding
      - scheduling.k8s.io/PriorityClass
      - networking.k8s.io/IngressClass
      - networking.k8s.io/IPAddress
      - networking.k8s.io/ServiceCIDR
      - node.k8s.io/RuntimeClass
      - apiregistration.k8s.io/APIService
      - certificates.k8s.io/CertificateSigningRequest
      - certificates.k8s.io/ClusterTrustBundle
      - flowcontrol.apiserver.k8s.io/FlowSchema
      - flowcontrol.apiserver.k8s.io/PriorityLevelConfiguration
      - policy/PodSecurityPolicy
      - resource.k8s.io/DeviceClass
      - resource.k8s.io/ResourceSlice
      - snapshot.storage.k8s.io/VolumeSnapshotClass
      - snapshot.storage.k8s.io/VolumeSnapshotContent
      - gateway.networking.k8s.io/GatewayClass
      - external-secrets.io/ClusterSecretStore
      - external-secrets.io/ClusterExternalSecret
      - external-secrets.io/ClusterPushSecret
      - generators.external-secrets.io/ClusterGenerator
      - cert-manager.io/ClusterIssuer
      - trust.cert-manager.io/Bundle
      - kyverno.io/ClusterPolicy
      - kyverno.io/ClusterCleanupPolicy
      - templates.gatekeeper.sh/ConstraintTemplate
      - keda.sh/ClusterTriggerAuthentication
      - cilium.io/CiliumClusterwideNetworkPolicy
      - crd.projectcalico.org/GlobalNetworkPolicy
      - projectcalico.org/GlobalNetworkPolicy
      - security.openshift.io/SecurityContextConstraints
      - quota.openshift.io/ClusterResourceQuota
      - argoproj.io/ClusterWorkflowTemplate
  # The API groups of the deployer engines' custom resources: such an object
  # in a project's namespace lets it drive the engine with the engine's own
  # identity.
  deployerApiGroups:
    values:
      - helm.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - fluxcd.controlplane.io
      - source.extensions.fluxcd.io
      - argoproj.io
  # The keys the upstream values of an instance of a project that is not
  # privileged set nowhere, at any depth, to any value: a pod's privileges
  # on its node, its security context whole, its identity, and the containers
  # and objects a chart adds from its values. The scheduling keys stay free.
  deniedUpstreamKeys:
    addFrom: policy.upstream.deny
    values:
      - privileged
      - hostPath
      - hostNetwork
      - hostPID
      - hostIPC
      - hostPort
      - allowPrivilegeEscalation
      - capabilities
      - seccompProfile
      - sysctls
      - securityContext
      - podSecurityContext
      - containerSecurityContext
      - serviceAccountName
      - serviceAccount
      - automountServiceAccountToken
      - extraContainers
      - sidecars
      - initContainers
      - extraInitContainers
      - extraObjects
      - extraDeploy
      - extraManifests
      - extraResources
      - extraSecrets
      - extraConfigMaps
      - externalIPs
  # What the name of a key ends with, in lower case, when the key holds an
  # image, a registry or a repository of images by its own name. The key
  # image itself is read with its sibling keys.
  imageKeySuffixes:
    values: [image, imageregistry, imagerepository, imagename]
  # The names of the objects the platform writes in the namespace of every
  # project besides its instances': a release may not take one.
  platformObjectNames:
    values:
      - okdp-project
      - okdp-control-plane
      - okdp-access-viewer
      - okdp-access-editor
      - okdp-access-admin
      - okdp-secrets
      - okdp-dcr-token
  # The annotations that name hosts, their values lists of hosts separated
  # by commas and spaces.
  hostAnnotations:
    values:
      - cert-manager.io/common-name
      - cert-manager.io/alt-names
      - nginx.ingress.kubernetes.io/server-alias
      - external-dns.alpha.kubernetes.io/hostname
  # The keys of the values of a chart that hold its ingress; under them, the
  # keys that hold one host, and those that hold a list of hosts.
  ingressValueKeys:
    values: [ingress, ingresses]
  ingressHostKeys:
    values: [host, hostname, commonName]
  ingressHostListKeys:
    values: [hosts, hostnames, dnsNames, extraHosts]
  # The keys of global a project sets when the platform lists none
  # (global.okdp.policy.projectGlobals).
  defaultProjectGlobals:
    values: [project, storageClass]
# The checks: each a document of vars and errors (the mapping language),
# applied by a walker of the compiler, the first message refusing. They see
# their input and sets, each table as a set, and tables, as a list.
checks:
  namespace: checks/namespace.cel.yaml
  platformNamespace: checks/platform-namespace.cel.yaml
  release: checks/release.cel.yaml
  object: checks/objects.cel.yaml
  upstreamKey: checks/upstream-key.cel.yaml
  plainSecret: checks/plain-secret.cel.yaml
  host: checks/host.cel.yaml
  contextLayer: checks/context-layer.cel.yaml
  valuesLayer: checks/values-layer.cel.yaml
# The JSON schema of what a mapping writes.
schemas:
  mapping: schemas/mapping.schema.json
# The charts the compiler adds: objects, overridden by
# global.okdp.charts.objects.
charts:
  objects: {repository: oci://quay.io/okdp/charts, chart: okdp-objects, version: 0.1.0}
# Documents the targets call: the Role of a project's releases.
documents:
  deployerRole: objects/deployer-role.cel.yaml
