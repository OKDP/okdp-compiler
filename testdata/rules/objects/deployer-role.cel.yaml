# The rules of the Role a project's releases are installed with in its
# namespace, the Flux target's (internal/target/flux): the API groups a
# project deploys, every verb on every resource of each, and the RBAC of its
# namespace without escalate nor bind: RBAC has no negation, so this list
# holds what the catalogs' charts render and leaves the engines' groups out
# (they let a project drive the engine with the engine's identity). The
# platform adds groups (global.okdp.policy.projectApiGroups): "*" and the
# engines' groups (sets.deployerApiGroups) are not added, whatever it says.
# Input: items, the groups the platform adds.
vars:
  # The core group, workloads, networking and the operators the packages
  # render objects of (every apiVersion of their templates, grepped).
  base:
    - ""
    - apps
    - batch
    - autoscaling
    - policy
    - networking.k8s.io
    - discovery.k8s.io
    - coordination.k8s.io
    - external-secrets.io
    - generators.external-secrets.io
    - cert-manager.io
    - monitoring.coreos.com
    - gateway.networking.k8s.io
    - postgresql.cnpg.io
    - kafka.strimzi.io
    - k8ssandra.io
    - medusa.k8ssandra.io
    - reaper.k8ssandra.io
    - cassandra.datastax.com
    - nifi.konpyutaika.com
    - sparkoperator.k8s.io
  added: ${{ asList(items).filter(g, g != "*" && !(g in sets.deployerApiGroups) && !(g in base)) }}
values:
  rules:
    - apiGroups: ${{ base + added }}
      resources: ["*"]
      verbs: ["*"]
    - apiGroups: ["rbac.authorization.k8s.io"]
      resources: ["roles", "rolebindings"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
