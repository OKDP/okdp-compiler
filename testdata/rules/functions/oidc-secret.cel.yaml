# The Secret that holds the OAuth client named arg ("" for the service's main
# client) of a release: written by its registration Job in dcr mode, provisioned
# by the platform otherwise. Input: arg, release, platform.
vars:
  tail: >-
    ${{ str(arg) == "" ? "" : "-" + str(arg) }}
values:
  secret: >-
    ${{ platform.oidc.dcr.enabled ? release.name + "-" + release.namespace + tail + "-dcr" : "creds-" + release.name + "-oauth2" + tail }}
