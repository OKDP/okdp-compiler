# Releases: on each push to main, release-please updates a release pull
# request with the next version and CHANGELOG.md, from the conventional
# commits since the last release; merging it tags vX.Y.Z and publishes the
# GitHub release. Settings: release-please-config.json; the current version:
# .release-please-manifest.json.
#
# Then, when a release was created, goreleaser builds the okdp-compile
# binaries of its tag and attaches them to it, its notes kept, with an
# SBOM of each archive and the checksums signed keyless by cosign
# (.goreleaser.yaml); and the build provenance of the archives is
# attested (SLSA, GitHub's attestations: gh attestation verify). It runs
# here, not on the tag: a tag pushed with GITHUB_TOKEN triggers no other
# workflow.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The workflow's OIDC token: cosign's keyless certificate, the
      # attestations' signature.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      # No cache: the binaries are built from downloaded modules, not from a
      # cache another workflow run could have written.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # cosign and syft, which goreleaser runs, pinned: each action
      # downloads that release.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.56.0
      # goreleaser itself pinned: the action downloads that release.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The provenance of the archives: this workflow, its commit, its
      # inputs, signed with the OIDC token and recorded by GitHub.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
