# Fuzz: every night, and on demand, the fuzz tests of the Makefile
# (make fuzz: the paths, the access, claim ID, upstream, layers and load
# rules; those of the language, the scanner of ${{ }}, the
# reader and the host functions' cost, are github.com/okdp/cel2yaml's), each
# for FUZZTIME. A failing input is written under the
# package's testdata/fuzz/, uploaded as an artifact to be reproduced
# (go test -run '<Test>/<file>') and committed with its fix.
name: fuzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: make fuzz
        run: make fuzz FUZZTIME=60s
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: |
            chart/testdata/fuzz/
            internal/**/testdata/fuzz/
          if-no-files-found: ignore
