# Fuzz: every night, and on demand, the fuzz tests of the Makefile
# (make fuzz: the scanner of ${{ }}, the mapping reader, the paths and the
# values parser), each for FUZZTIME. A failing input is written under the
# package's testdata/fuzz/, uploaded as an artifact to be reproduced
# (go test -run '<Test>/<file>') and committed with its fix.
name: fuzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: make fuzz
        run: make fuzz FUZZTIME=60s
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore
